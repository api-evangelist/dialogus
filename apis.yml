name: Dialogus
description: Dialogus is a frontier AI voice lab building infrastructure for enterprise-grade
  voice agents that resolve, trace, and control every live conversation across phone systems,
  internal workflows, and customer systems. Its platform connects voice agents to phone
  systems, internal tools, databases, CRMs, and messaging channels, with human escalation
  flows, monitoring, and compliance built in. Agents run a Listen, Reason, Act, and Report
  loop that detects turns, silence, and intent, constrains the model with workflow state
  and policies, executes approved tools, and produces auditable transcripts and outcomes.
  Dialogus targets live customer support, phone order-taking into the POS, and past-due
  collections, and positions itself as SOC 2 compliant for live operations. Founded by
  ex-Google, Meta, and Microsoft engineers, it is a Y Combinator Summer 2026 company based
  in San Francisco.
